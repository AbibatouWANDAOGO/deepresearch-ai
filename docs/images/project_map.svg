<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>DeepResearch AI project map: the research pipeline and the phase that built each part</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d6d4cf; stroke-width: 1.5; }
      .key { fill: #ffffff; stroke: #2a78d6; stroke-width: 2; }
      .band { fill: #f3f2ee; stroke: none; }
      .t { font-size: 16px; font-weight: 700; fill: #0b0b0b; }
      .d { font-size: 12.5px; fill: #52514e; }
      .h { font-size: 22px; font-weight: 700; fill: #0b0b0b; }
      .s { font-size: 13px; fill: #52514e; }
      .lbl { font-size: 12px; fill: #52514e; }
      .loop { font-size: 12px; fill: #b4461d; font-weight: 600; }
      .badge { fill: #2a78d6; }
      .bt { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .flow { stroke: #52514e; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="690" fill="#fcfcfb"/>
  <text x="30" y="40" class="h">DeepResearch AI: project map</text>
  <text x="30" y="62" class="s">The research pipeline, from question to cited report. Each badge is the phase that built the part.</text>

  <!-- Row 1: left to right -->
  <g>
    <rect x="30" y="90" width="190" height="104" rx="10" class="box"/>
    <text x="46" y="122" class="t">Question</text>
    <text x="46" y="146" class="d">French or English,</text>
    <text x="46" y="164" class="d">depth and max sources</text>
    <text x="46" y="182" class="d">from dashboard or CLI</text>
  </g>
  <g>
    <rect x="260" y="90" width="190" height="104" rx="10" class="box"/>
    <rect x="404" y="98" width="38" height="20" rx="10" class="badge"/><text x="423" y="112" class="bt" text-anchor="middle">P5</text>
    <text x="276" y="122" class="t">Planner</text>
    <text x="276" y="146" class="d">2 to 5 sub-questions,</text>
    <text x="276" y="164" class="d">search queries,</text>
    <text x="276" y="182" class="d">quality criteria</text>
  </g>
  <g>
    <rect x="490" y="90" width="190" height="104" rx="10" class="box"/>
    <rect x="616" y="98" width="56" height="20" rx="10" class="badge"/><text x="644" y="112" class="bt" text-anchor="middle">P2·P5</text>
    <text x="506" y="122" class="t">Search</text>
    <text x="506" y="146" class="d">Tavily, DuckDuckGo</text>
    <text x="506" y="164" class="d">fallback, credit ledger;</text>
    <text x="506" y="182" class="d">Researcher picks sources</text>
  </g>
  <g>
    <rect x="720" y="90" width="190" height="104" rx="10" class="box"/>
    <rect x="864" y="98" width="38" height="20" rx="10" class="badge"/><text x="883" y="112" class="bt" text-anchor="middle">P3</text>
    <text x="736" y="122" class="t">Collect</text>
    <text x="736" y="146" class="d">pages and PDFs, safe</text>
    <text x="736" y="164" class="d">download, cleaning,</text>
    <text x="736" y="182" class="d">dedupe, SQLite metadata</text>
  </g>
  <g>
    <rect x="950" y="90" width="210" height="104" rx="10" class="box"/>
    <rect x="1114" y="98" width="38" height="20" rx="10" class="badge"/><text x="1133" y="112" class="bt" text-anchor="middle">P4</text>
    <text x="966" y="122" class="t">Hybrid RAG</text>
    <text x="966" y="146" class="d">chunks with offsets, E5</text>
    <text x="966" y="164" class="d">vectors in Qdrant + BM25,</text>
    <text x="966" y="182" class="d">RRF fusion, reranker</text>
  </g>

  <line x1="220" y1="142" x2="256" y2="142" class="flow" marker-end="url(#arrow)"/>
  <line x1="450" y1="142" x2="486" y2="142" class="flow" marker-end="url(#arrow)"/>
  <line x1="680" y1="142" x2="716" y2="142" class="flow" marker-end="url(#arrow)"/>
  <line x1="910" y1="142" x2="946" y2="142" class="flow" marker-end="url(#arrow)"/>
  <path d="M1055,194 L1055,296" class="flow" marker-end="url(#arrow)"/>
  <text x="1065" y="250" class="lbl">passages</text>

  <!-- Row 2: right to left -->
  <g>
    <rect x="950" y="300" width="210" height="104" rx="10" class="box"/>
    <rect x="1114" y="308" width="38" height="20" rx="10" class="badge"/><text x="1133" y="322" class="bt" text-anchor="middle">P5</text>
    <text x="966" y="332" class="t">Analyst</text>
    <text x="966" y="356" class="d">claims, each tied to</text>
    <text x="966" y="374" class="d">the passages it cites;</text>
    <text x="966" y="392" class="d">invented ids dropped</text>
  </g>
  <g>
    <rect x="720" y="300" width="190" height="104" rx="10" class="key"/>
    <rect x="848" y="308" width="56" height="20" rx="10" class="badge"/><text x="876" y="322" class="bt" text-anchor="middle">P5·P9</text>
    <text x="736" y="332" class="t">Fact Checker</text>
    <text x="736" y="356" class="d">model gives a verdict,</text>
    <text x="736" y="374" class="d">code rules cap it to</text>
    <text x="736" y="392" class="d">the cited evidence</text>
  </g>
  <g>
    <rect x="490" y="300" width="190" height="104" rx="10" class="box"/>
    <rect x="634" y="308" width="38" height="20" rx="10" class="badge"/><text x="653" y="322" class="bt" text-anchor="middle">P6</text>
    <text x="506" y="332" class="t">Router</text>
    <text x="506" y="356" class="d">LangGraph: enough</text>
    <text x="506" y="374" class="d">evidence? time left?</text>
    <text x="506" y="392" class="d">SQLite checkpoints</text>
  </g>
  <g>
    <rect x="260" y="300" width="190" height="104" rx="10" class="box"/>
    <rect x="404" y="308" width="38" height="20" rx="10" class="badge"/><text x="423" y="322" class="bt" text-anchor="middle">P7</text>
    <text x="276" y="332" class="t">Writer</text>
    <text x="276" y="356" class="d">statements built by</text>
    <text x="276" y="374" class="d">code from checked claims;</text>
    <text x="276" y="392" class="d">model writes the summary</text>
  </g>
  <g>
    <rect x="30" y="300" width="190" height="104" rx="10" class="key"/>
    <rect x="174" y="308" width="38" height="20" rx="10" class="badge"/><text x="193" y="322" class="bt" text-anchor="middle">P7</text>
    <text x="46" y="332" class="t">Cited report</text>
    <text x="46" y="356" class="d">Markdown, PDF, JSON;</text>
    <text x="46" y="374" class="d">every [S#] leads to</text>
    <text x="46" y="392" class="d">a page and a quote</text>
  </g>

  <line x1="950" y1="352" x2="914" y2="352" class="flow" marker-end="url(#arrow)"/>
  <line x1="720" y1="352" x2="684" y2="352" class="flow" marker-end="url(#arrow)"/>
  <line x1="490" y1="352" x2="454" y2="352" class="flow" marker-end="url(#arrow)"/>
  <line x1="260" y1="352" x2="224" y2="352" class="flow" marker-end="url(#arrow)"/>
  <text x="458" y="344" class="lbl">done</text>

  <!-- Loop back -->
  <path d="M585,300 L585,250 L585,248 L585,198" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-loop)"/>
  <text x="595" y="244" class="loop">evidence missing:</text>
  <text x="595" y="260" class="loop">new queries (bounded cycles)</text>

  <!-- Foundations band -->
  <rect x="20" y="440" width="1160" height="232" rx="12" class="band"/>
  <text x="40" y="472" class="t">Around the pipeline</text>
  <text x="200" y="472" class="s">what makes it usable, measurable, safe and reproducible</text>

  <g>
    <rect x="40" y="490" width="214" height="164" rx="10" class="box"/>
    <rect x="198" y="498" width="48" height="20" rx="10" class="badge"/><text x="222" y="512" class="bt" text-anchor="middle">P1</text>
    <text x="56" y="524" class="t">Foundations</text>
    <text x="56" y="550" class="d">validated settings,</text>
    <text x="56" y="568" class="d">free local model by</text>
    <text x="56" y="586" class="d">default, paid APIs opt-in</text>
    <text x="56" y="604" class="d">with a cost cap;</text>
    <text x="56" y="622" class="d">283 tests, no network</text>
  </g>
  <g>
    <rect x="266" y="490" width="214" height="164" rx="10" class="box"/>
    <rect x="424" y="498" width="48" height="20" rx="10" class="badge"/><text x="448" y="512" class="bt" text-anchor="middle">P8</text>
    <text x="282" y="524" class="t">Dashboard</text>
    <text x="282" y="550" class="d">Streamlit; research in a</text>
    <text x="282" y="568" class="d">background process,</text>
    <text x="282" y="586" class="d">live progress, cancel</text>
    <text x="282" y="604" class="d">and resume, claims and</text>
    <text x="282" y="622" class="d">sources views</text>
  </g>
  <g>
    <rect x="492" y="490" width="214" height="164" rx="10" class="box"/>
    <rect x="650" y="498" width="48" height="20" rx="10" class="badge"/><text x="674" y="512" class="bt" text-anchor="middle">P9</text>
    <text x="508" y="524" class="t">Evaluation</text>
    <text x="508" y="550" class="d">10 questions (fr / en):</text>
    <text x="508" y="568" class="d">coverage, retrieval,</text>
    <text x="508" y="586" class="d">citation precision,</text>
    <text x="508" y="604" class="d">latency, cost; fixes</text>
    <text x="508" y="622" class="d">replayed offline</text>
  </g>
  <g>
    <rect x="718" y="490" width="214" height="164" rx="10" class="box"/>
    <rect x="876" y="498" width="48" height="20" rx="10" class="badge"/><text x="900" y="512" class="bt" text-anchor="middle">P10</text>
    <text x="734" y="524" class="t">Security</text>
    <text x="734" y="550" class="d">SSRF and DNS rebinding</text>
    <text x="734" y="568" class="d">blocked, rate limit,</text>
    <text x="734" y="586" class="d">pages framed as data</text>
    <text x="734" y="604" class="d">(prompt injection),</text>
    <text x="734" y="622" class="d">logs without secrets</text>
  </g>
  <g>
    <rect x="944" y="490" width="216" height="164" rx="10" class="box"/>
    <rect x="1104" y="498" width="48" height="20" rx="10" class="badge"/><text x="1128" y="512" class="bt" text-anchor="middle">P11</text>
    <text x="960" y="524" class="t">Docker</text>
    <text x="960" y="550" class="d">Ollama + app, one</text>
    <text x="960" y="568" class="d">command, volumes,</text>
    <text x="960" y="586" class="d">non-root, dashboard on</text>
    <text x="960" y="604" class="d">localhost only; full</text>
    <text x="960" y="622" class="d">research run inside</text>
  </g>
</svg>
